<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Content -->
    <div class="container mt-4">

        <h3>Edit Student</h3>

        <form th:action="@{/update}" method="post">

            <!-- Hidden ID -->
            <input type="hidden" name="id" th:value="${student.id}">

            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="name" class="form-control" th:value="${student.name}" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="emailId" class="form-control" th:value="${student.emailId}" required>
            </div>

            <div class="mb-3">
                <label>Course</label>
                <select name="courseName" class="form-control">
                    <option th:each="c : ${courses}"
                            th:value="${c.courseName}"
                            th:text="${c.courseName}"
                            th:selected="${c.courseName == student.courseName}">
                    </option>
                </select>
            </div>

            <button class="btn btn-primary">Update</button>
            <a href="/students" class="btn btn-secondary">Cancel</a>

        </form>

    </div>

</div>

</body>
</html>
