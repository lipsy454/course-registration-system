<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Enroll Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="d-flex">

       <div th:replace="~{fragments/sidebar :: sidebar}"></div>


    <!-- Main Content -->
    <div class="container mt-5 d-flex justify-content-center">

        <div class="card shadow p-4" style="width: 500px;">

            <h3 class="mb-4 text-center">Enroll Course</h3>

            <form action="/courses/register" method="post">

                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="emailId" class="form-control" placeholder="Enter your email" required>
                </div>

                <!-- Course Dropdown -->
                <div class="mb-3">
                    <label class="form-label">Select Course</label>
                    <select name="courseName" class="form-select" required>
                        <option value="">-- Select Course --</option>
                        <option th:each="c : ${courses}"
                                th:value="${c.courseName}"
                                th:text="${c.courseName}">
                        </option>
                    </select>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary w-100">Enroll</button>

            </form>

            <!-- Back -->
            <div class="text-center mt-3">
                <a href="/dashboard">Back to Dashboard</a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
