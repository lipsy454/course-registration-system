<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="d-flex">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="container mt-4">

        <h3>Dashboard</h3>

        <!-- ================= CARDS ================= -->
        <div class="row mb-4">

            <div class="col-md-3">
                <div class="card bg-primary text-white p-3 text-center">
                    <h5>Total Courses</h5>
                    <h2 th:text="${totalCourses}"></h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-success text-white p-3 text-center">
                    <h5>Total Students</h5>
                    <h2 th:text="${totalStudents}"></h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-warning text-dark p-3 text-center">
                    <h5>Quick Add</h5>
                    <a href="/register" class="btn btn-dark btn-sm mt-2">Enroll Student</a>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-info text-white p-3 text-center">
                    <h5>View Courses</h5>
                    <a href="/courses" class="btn btn-light btn-sm mt-2">Open</a>
                </div>
            </div>

        </div>

        <!-- ================= CHARTS ================= -->
        <div class="row mb-4">

            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Students per Course</h5>
                    <canvas id="barChart"></canvas>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Course Distribution</h5>
                    <canvas id="pieChart"></canvas>
                </div>
            </div>

        </div>

<!-- ================= SCRIPTS ================= -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">

    const labels = [[${courseLabels}]];
    const data = [[${courseData}]];

    // Bar Chart
    new Chart(document.getElementById("barChart"), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Students',
                data: data,
                backgroundColor: 'blue'
            }]
        }
    });

    // Pie Chart
    new Chart(document.getElementById("pieChart"), {
        type: 'pie',
        data: {
            labels: labels,
            datasets: [{
                data: data
            }]
        }
    });

    // Search
    document.getElementById("search").addEventListener("keyup", function () {
        let filter = this.value.toLowerCase();
        let rows = document.querySelectorAll("#studentTable tbody tr");

        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(filter) ? "" : "none";
        });
    });

</script>

</body>
</html>
